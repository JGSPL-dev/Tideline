name: Checks
# Every push: the app must start cleanly from saved data of every era, and the service and browser tests must pass.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start-up smoke test
        run: node smoke.mjs
      - name: Service tests
        run: node --test worker.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Browser tests (the real app with mocked feeds)
        run: |
          pip install -q -r browser/requirements.txt
          python -m playwright install chromium
          python -m pytest -q browser
