name: Check catalogue
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check-directory.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: directory-report
          path: directory-report.json
