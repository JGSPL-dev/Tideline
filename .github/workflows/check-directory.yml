name: Check catalogue
on:
  workflow_dispatch:
    inputs:
      list:
        description: JSON list to check instead of the catalogue (path in the repo)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check-directory.mjs ${{ inputs.list }}
        env:
          CONC: ${{ inputs.list && '1' || '8' }}
          GAP: ${{ inputs.list && '1500' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: directory-report
          path: directory-report.json
