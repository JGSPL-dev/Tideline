name: Probe addresses
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Space-separated addresses to fetch (status and the start of the reply are printed)
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
        run: |
          for u in $URLS; do
            echo "=== $u"
            curl -s -m 20 -A "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" -H "Accept: application/json" -o /tmp/out -w "HTTP %{http_code} %{content_type}\n" "$u"
            head -c 1500 /tmp/out | tr '\n' ' '; echo
            echo "ITEMS $(grep -o '<item>\|<entry>' /tmp/out | wc -l) BYTES $(wc -c < /tmp/out)"
            grep -o '<item><title>[^<]*' /tmp/out | head -5 | sed 's/^/TITLE /'
            echo "ARTICLE-LINKS $(grep -o './read/[A-Za-z0-9_-]*\|./articles/[A-Za-z0-9_-]*' /tmp/out | sort -u | wc -l)"
            grep -o 'aria-label="[^"]\{20,140\}"' /tmp/out | head -6 | sed 's/^/LABEL /'
            grep -io '<link[^>]*alternate[^>]*>' /tmp/out | head -6 | sed 's/^/ALT /'
            grep -io 'href="[^"]*\(\.ics\|rss\|feed\|webcal\|calendar\)[^"]*"' /tmp/out | sort -u | head -10 | sed 's/^/LINK /'
            echo "VEVENTS $(grep -c 'BEGIN:VEVENT' /tmp/out)"
            grep -m3 '^SUMMARY' /tmp/out | sed 's/^/ICS /'
          done
