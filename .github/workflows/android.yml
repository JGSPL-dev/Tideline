name: Android build
# Manual only: changes are batched and the app is rebuilt when Josh asks.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key (private release key from Actions secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Release builds are signed with the private key kept in this repo's Actions secrets.
          # Without it, the build is signed with a one-off key: it installs, but won't update the previous build.
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "KS_KIND=release" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets are missing: signing with a one-off key"
            P=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$P" -keypass "$P" -alias yourfeed -keyalg RSA -keysize 3072 -validity 400 -dname "CN=YourFeed one-off" >/dev/null 2>&1
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "KS_KIND=one-off" >> "$GITHUB_ENV"
          fi
          echo "KS_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp ../index.html ../icon.svg ../icon-192.png ../icon-512.png ../apple-touch-icon.png ../manifest.webmanifest www/
          cp -r ../fonts www/
          sed -i "s|__APP_BUILD__|0.2.${{ github.run_number }} · $(date -u +'%-d %b %Y %H:%M') UTC · ${GITHUB_SHA::7}|" www/index.html
          grep -q "0.2.${{ github.run_number }}" www/index.html
          npx cap add android
          npx cap sync android
          cp -r res/* android/app/src/main/res/
          # Full-screen video inside the app (rotates to landscape)
          cp native/MainActivity.java android/app/src/main/java/uk/co/appsforus/yourfeed/MainActivity.java
          sed -i "s/versionCode 1$/versionCode $((100 + ${{ github.run_number }}))/; s/versionName \"1.0\"/versionName \"0.2.${{ github.run_number }}\"/" android/app/build.gradle
          grep -q "versionCode $((100 + ${{ github.run_number }}))" android/app/build.gradle
          # Podcasts keep playing in the background: the media-session plugin runs a foreground service,
          # which Android 14+ only allows with this permission
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|&\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />|' android/app/src/main/AndroidManifest.xml
          grep -q FOREGROUND_SERVICE_MEDIA_PLAYBACK android/app/src/main/AndroidManifest.xml
          # HTTPS only: no plain-HTTP traffic from the app
          sed -i 's|<application|<application android:usesCleartextTraffic="false"|' android/app/src/main/AndroidManifest.xml
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "yourfeed"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      debuggable false
                  }
              }
          }
          GRADLE
          cd android && chmod +x gradlew
          for n in 1 2 3 4; do ./gradlew assembleRelease --no-daemon -q && break; echo "Build attempt $n failed, retrying"; sleep 20; done
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/yourfeed.apk"
      - name: Publish as the "test-build" download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build yourfeed.apk --prerelease --target "$GITHUB_SHA" \
            --title "YourFeed Android test build 0.2.${{ github.run_number }} ($KS_KIND key)" \
            --notes "Test build from commit ${GITHUB_SHA::7}. Download yourfeed.apk on your Android phone and open it to install."
