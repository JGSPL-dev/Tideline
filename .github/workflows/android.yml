name: Android test build
on:
  push:
    branches: [main]
    paths: ["index.html", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build the app
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp ../index.html ../icon.svg ../icon-192.png ../icon-512.png ../apple-touch-icon.png ../manifest.webmanifest www/
          sed -i "s|__APP_BUILD__|0.1.${{ github.run_number }} · $(date -u +'%-d %b %Y %H:%M') UTC · ${GITHUB_SHA::7}|" www/index.html
          grep -q "0.1.${{ github.run_number }}" www/index.html
          npx cap add android
          npx cap sync android
          cp -r res/* android/app/src/main/res/
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew
          for n in 1 2 3 4; do ./gradlew assembleDebug --no-daemon -q && break; echo "Build attempt $n failed, retrying"; sleep 20; done
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/tickrss.apk"
      - name: Publish as the "test-build" download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build tickrss.apk --prerelease --target "$GITHUB_SHA" \
            --title "tick/rss Android test build 0.1.${{ github.run_number }}" \
            --notes "Test build from commit ${GITHUB_SHA::7}. Download tickrss.apk on your Android phone and open it to install. Not for the Play Store."
